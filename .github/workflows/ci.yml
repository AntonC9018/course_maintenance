# Shared CI for course_maintenance (issue #14, CI-1..CI-12 shared side).
#
# Validates the shared implementation and its isolated fixtures. Course
# repositories do not use this workflow; they copy
# docs/ci-caller-workflow.yml and invoke
# `python3 course_maintenance/publish.py ci --course-repo .` from their
# pinned submodule revision (see docs/ci-caller-contract.md).

name: course_maintenance CI

on:
  push:
  pull_request:

# Read-only validation; no deployment from this repository.
permissions:
  contents: read

# Discard superseded runs (same discipline as course caller workflows).
concurrency:
  group: course-maintenance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read shared toolchain pins
        id: pins
        run: python3 publish.py toolchain show

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.pins.outputs.python_version }}

      - name: Setup Node 22 with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node_version }}
          # CI-8: npm cache keyed by the pinned lockfile revision.
          cache: npm
          cache-dependency-path: ${{ steps.pins.outputs.npm_lockfile }}

      # CI-8: Playwright/Chromium runtime cache keyed by pinned versions
      # (publishing/site.py PINNED_VERSIONS/PINNED_BROWSERS) plus the
      # lockfile hash. Browsers are runtimes only, never authoritative
      # build output; a version or lockfile change never hits stale cache.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pins.outputs.browser_cache_key }}

      - name: Compile check (stdlib only, no install)
        run: python3 -m py_compile publish.py maintain.py publishing/*.py

      - name: Shared unit suite (isolated temp-dir fixtures)
        run: python3 -m unittest discover -s tests

      - name: Verify CI cache keys track pins
        run: python3 -c "from publishing.ci import browser_cache_key, npm_cache_key; print(npm_cache_key()); print(browser_cache_key())"

      - name: Create isolated course for shared-action integration
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from tests.test_ci import make_min_repo
          repo = Path(os.environ['RUNNER_TEMP']) / 'course-fixture'
          make_min_repo(repo)
          path = repo / 'course-publishing.json'
          config = json.loads(path.read_text())
          config['ci'] = {'run_compatibility_tests': False}
          path.write_text(json.dumps(config))
          PY

      - name: Validate and build fixture through the shared action
        uses: ./.github/actions/course-ci
        with:
          course-repo: ${{ runner.temp }}/course-fixture
          out: ${{ runner.temp }}/course-fixture-site
