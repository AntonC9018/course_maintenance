name: Course document CI
description: Validate course policy, install the pinned shared toolchain, and build the course.
inputs:
  course-repo:
    description: Course repository root
    default: .
  out:
    description: Site output directory outside the course repository
    required: true
runs:
  using: composite
  steps:
    - name: Validate course policy and read shared pins
      id: pins
      shell: bash
      env:
        COURSE_REPO: ${{ inputs.course-repo }}
      run: python3 "$GITHUB_ACTION_PATH/../../../publish.py" ci prepare --course-repo "$COURSE_REPO"
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ steps.pins.outputs.python_version }}
    - name: Setup Node with npm cache
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ steps.pins.outputs.node_version }}
        cache: npm
        cache-dependency-path: ${{ steps.pins.outputs.npm_lockfile }}
    - name: Cache Playwright browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pins.outputs.browser_cache_key }}
    - name: Install renderer dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH/../../../renderer" --no-audit --no-fund
    - name: Install Playwright Chromium
      shell: bash
      run: npx --prefix "$GITHUB_ACTION_PATH/../../../renderer" playwright install chromium
    # Tracing needs the course's own pinned toolchain (its flake dev shell),
    # so these steps run only for courses that configure visualizations.
    - name: Install Nix for the visualization toolchain
      if: steps.pins.outputs.visualizations == 'true'
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - name: Cache Nix store paths
      if: steps.pins.outputs.visualizations == 'true'
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
    # Traces are content addressed, so a partial restore from an older set
    # only leaves the changed examples to trace; unused ones are pruned.
    - name: Restore visualization traces
      if: steps.pins.outputs.visualizations == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pins.outputs.visualizations_traces }}
        key: visualizations-${{ steps.pins.outputs.visualizations_cache_key }}
        restore-keys: visualizations-
    - name: Trace tagged examples
      if: steps.pins.outputs.visualizations == 'true'
      shell: bash
      env:
        COURSE_REPO: ${{ inputs.course-repo }}
        SHELL_REF: ${{ steps.pins.outputs.visualizations_shell }}
      run: nix develop "$SHELL_REF" --command python3 "$GITHUB_ACTION_PATH/../../../publish.py" visualizations generate --course-repo "$COURSE_REPO"
    - name: Course document validation and site build
      shell: bash
      env:
        COURSE_REPO: ${{ inputs.course-repo }}
        COURSE_SITE_OUT: ${{ inputs.out }}
      run: python3 "$GITHUB_ACTION_PATH/../../../publish.py" ci --course-repo "$COURSE_REPO" --out "$COURSE_SITE_OUT"
